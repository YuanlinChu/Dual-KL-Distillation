# `on_policy_distill/train_on_policy_rl_local.py` 的可执行实验配置文件。
#
# 使用方法：
# 1. 只使用 base 配置：
#    accelerate launch -m on_policy_distill.train_on_policy_rl_local \
#      --config on_policy_distill/opd_rl_experiments.yaml
#
# 2. 使用某个具名实验（会在 base 基础上覆盖）：
#    accelerate launch -m on_policy_distill.train_on_policy_rl_local \
#      --config on_policy_distill/opd_rl_experiments.yaml \
#      --experiment standard_opd
#
# 3. YAML 里的值仍然可以被命令行覆盖，例如：
#    ... --experiment dual_kl_mid_f --learning_rate 5e-6

base:
  # 学生模型
  # 这里应填写本地模型目录路径；云端无网环境下请使用 modelscope 下载后的本地目录
  student_model: "/data/oss_bucket_0/zhulin/models/Qwen3-1.7B-Base"
  # 教师模型
  teacher_model: "/data/oss_bucket_0/zhulin/models/Qwen3-8B"
  # 默认输出目录；建议每个实验在具名实验里覆盖
  output_dir: "./out/opd-rl-base"

  # 数据配置
  # 这里应填写本地数据集目录路径；例如 HF save_to_disk 目录或包含 parquet 的本地目录
  dataset: "/data/oss_bucket_0/zhulin/datasets/DeepMath-103K"
  dataset_field: "question"
  system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."

  # 训练步数与 batch
  steps: 400
  batch_size: 256
  group_size: 4
  # 同一批 rollout 上重复优化的子步数，PPO/GRPO 风格参数
  num_substeps: 1

  # 采样配置
  max_new_tokens: 1024
  max_prompt_tokens: 1024
  temperature: 1.0
  top_p: 1.0

  # 优化器和学习率
  learning_rate: 1.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_decay: "linear"
  min_lr_ratio: 0.1

  # 模型/显存配置
  dtype: "bf16"
  use_lora: true
  lora_r: 32
  lora_alpha: 32
  lora_dropout: 0.0

  # 教师模型分片与微批
  teacher_ds_zero3: true
  gen_micro_batch: 4
  lp_micro_batch: 2
  max_grad_norm: 1.0

  # 评估与保存
  eval_every: 25
  save_every: 25
  seed: 42

  # swanlab 日志配置：
  # 云端离线环境建议用 offline；有网时可改成 online；完全不记录可设 disabled
  swanlab_project: null
  swanlab_name: null
  swanlab_mode: "offline"

  # RL 优化目标：`ppo` 或 `importance_sampling`
  loss_fn: "ppo"
  ppo_clip_low: 0.2
  ppo_clip_high: 0.2

  # rKL 奖励项的全局系数与未来折扣
  # 建议标准 baseline 先用 kl_coef=1.0, kl_discount=0.0
  kl_coef: 1.0
  kl_discount: 0.0

  # dual-KL 框架开关
  # lam_r 控制 RL 主分支（rKL advantage）
  # lam_f 控制 teacher-sampled fKL 辅助分支
  lam_r: 1.0
  lam_f: 0.0
  use_fkl: false

# 标准 RL 风格 OPD 基线：
# 只使用 rKL，不使用 fKL。这个实验是最重要的对照组。
standard_opd:
  output_dir: "./out/opd-rl-r1f0"
  lam_r: 1.0
  lam_f: 0.0
  use_fkl: false
  kl_coef: 1.0
  kl_discount: 0.0
  loss_fn: "ppo"
  num_substeps: 1

# dual-KL 主实验：
# 在相同 RL 框架下，保留 rKL 主分支，并加入等权重的 fKL 辅助分支。
# 用来回答“在完整 RL 训练骨架里，引入 fKL 是否有效”。
dual_kl_equal:
  output_dir: "./out/opd-rl-r1f1"
  lam_r: 1.0
  lam_f: 1.0
  use_fkl: true

# 弱 fKL 辅助实验：
# 用来观察很小的 fKL 权重是否已经能带来收益。
dual_kl_mild_f:
  output_dir: "./out/opd-rl-r1f0.2"
  lam_r: 1.0
  lam_f: 0.2
  use_fkl: true

# 中等 fKL 辅助实验：
# 作为 lam_f=0.2 和 lam_f=1.0 之间的中间点，方便做趋势分析。
dual_kl_mid_f:
  output_dir: "./out/opd-rl-r1f0.5"
  lam_r: 1.0
  lam_f: 0.5
  use_fkl: true

# 重要性采样消融实验：
# 不用 PPO clipping，而是直接用 importance sampling 形式的 RL loss。
# 用于判断 PPO 的稳定化作用是否关键。
is_opd:
  output_dir: "./out/opd-rl-is-r1f0"
  loss_fn: "importance_sampling"
  lam_r: 1.0
  lam_f: 0.0
  use_fkl: false

# 多子步 PPO 消融实验：
# 同一批 rollout 上做两次优化，观察 PPO 风格多次更新是否有收益或是否更不稳定。
ppo_multistep:
  output_dir: "./out/opd-rl-ppo2-r1f0"
  loss_fn: "ppo"
  num_substeps: 2
  lam_r: 1.0
  lam_f: 0.0
  use_fkl: false
